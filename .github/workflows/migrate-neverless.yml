name: One-time Neverless migration
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy frozen source snapshots
        run: |
          git clone --depth 1 --branch migration-backup-2026-10-20 https://github.com/daithegoatt-sketch/Neverlessbot.git /tmp/neverlessbot
          git clone --depth 1 --branch migration-backup-2026-10-20 https://github.com/daithegoatt-sketch/-NeverlessBank.git /tmp/neverlessbank
          rsync -a --exclude='.git' /tmp/neverlessbot/ ./
          mkdir -p NeverlessBank
          rsync -a --exclude='.git' /tmp/neverlessbank/ ./NeverlessBank/
          git rm .github/workflows/migrate-neverless.yml
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate frozen Neverless sources"
          git push origin main
